name: Atualizar repositórios recentes

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 06:00 (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Gerar lista de repositórios recentes
        run: python3 scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commitar se houver mudança
        run: |
          if git diff --quiet; then
            echo "Sem mudanças no README."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: atualiza repositórios recentes"
          git push
