<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Pedro Meireles — Desenvolvedor Full Stack">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .p1 { animation: pulse 3.2s ease-in-out infinite; }
    .p2 { animation: pulse 3.2s ease-in-out 1.1s infinite; }
    .p3 { animation: pulse 3.2s ease-in-out 2.2s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .p1, .p2, .p3 { animation: none; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="50%" r="45%">
      <stop offset="0" stop-color="#b5f23d" stop-opacity=".13"/>
      <stop offset="1" stop-color="#b5f23d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1000" height="270" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="270" fill="#0c0f0d"/>
    <rect width="1000" height="270" fill="url(#dots)"/>
    <rect width="1000" height="270" fill="url(#glow)"/>
    <rect width="6" height="270" fill="#b5f23d"/>
  </g>
  <rect x=".5" y=".5" width="999" height="269" rx="19.5" fill="none" stroke="#25302a"/>

